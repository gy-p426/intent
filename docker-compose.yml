version: '3.8'

services:
  # 定义intent-recognition服务，构建Dockerfile
  intent-recognition:
    build: .
    ports:
      - "8000:8000"
    # 配置环境变量：NACOS_SERVER_ADDR, ARK_API_KEY, ARK_MODEL, LOG_LEVEL
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE=public
      - SERVICE_NAME=intent-recognition-service
      - SERVICE_PORT=8000
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_MODEL=${ARK_MODEL:-doubao-seed-1.6-250615}
      - ARK_TIMEOUT=60
      - EMBEDDING_MODEL=shibing624/text2vec-base-chinese
      - KNOWLEDGE_BASE_PATH=intent.txt
      - RAG_TOP_K=20
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LLM_MAX_RETRIES=3
      - LLM_RETRY_DELAY=2
    # 挂载intent.txt文件到容器
    volumes:
      - ./intent.txt:/app/intent.txt:ro
    depends_on:
      - nacos
    # 配置网络
    networks:
      - microservices
    restart: unless-stopped

  # 定义nacos服务，使用nacos/nacos-server:v2.2.3镜像
  nacos:
    image: nacos/nacos-server:v2.2.3
    # 配置端口映射
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - microservices
    restart: unless-stopped

# 配置网络
networks:
  microservices:
    driver: bridge

# 配置数据卷
volumes:
  nacos-data: